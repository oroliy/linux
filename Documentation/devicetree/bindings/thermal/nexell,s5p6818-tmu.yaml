%YAML 1.2
---
$id: http://devicetree.org/schemas/thermal/nexell,s5p6818-tmu.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nexell S5P6818 internal temperature monitor

maintainers:
  - liy <liygfg@gmail.com>

description: |
  Two TMU instances measure internal die temperature. The driver uses
  factory one-point calibration at 25 degrees Celsius and polling.
  nexell,tieoff references the shared four-byte trim sensing register at
  0xc0011130. Channel 0 and 1 use SENSING_START bits 0 and 1 and
  SENSING_DONE bits 3 and 4 respectively. This operation reads trim
  latches and does not program nonvolatile fuses.

$ref: thermal-sensor.yaml#

properties:
  compatible:
    const: nexell,s5p6818-tmu
  reg:
    maxItems: 1
  clocks:
    maxItems: 1
  clock-names:
    const: tmu_apbif
  nexell,tieoff:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Shared trim sensing syscon at 0xc0011130.
  nexell,channel:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1]
    description: TMU instance index.
  '#thermal-sensor-cells':
    const: 0

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - nexell,tieoff
  - nexell,channel
  - '#thermal-sensor-cells'

unevaluatedProperties: false
