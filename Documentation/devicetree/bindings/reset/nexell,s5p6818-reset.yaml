%YAML 1.2
---
$id: http://devicetree.org/schemas/reset/nexell,s5p6818-reset.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nexell S5P6818 Reset Controller

maintainers:
  - liy <liygfg@gmail.com>

description: |
  The S5P6818 reset controller manages the module resets.  Reset line
  identifiers are defined in
  include/dt-bindings/reset/nexell,s5p6818-reset.h.

properties:
  compatible:
    const: nexell,s5p6818-reset

  reg:
    maxItems: 1

  '#reset-cells':
    const: 1

required:
  - compatible
  - reg
  - '#reset-cells'

additionalProperties: false

examples:
  - |
    reset-controller@c0012000 {
        compatible = "nexell,s5p6818-reset";
        reg = <0xc0012000 0x0c>;
        #reset-cells = <1>;
    };
